name: Build ibox Docker Tar-X86
on:
  workflow_dispatch:
jobs:
  build_x86:
    runs-on: ubuntu-latest
    steps:
      - name: 安装docker
        uses: docker/setup-buildx-action@v3
      - name: 拉取ibox镜像
        run: docker pull lampon/omnibox:latest
      - name: 导出ibox.tar
        run: docker save -o ibox.tar lampon/omnibox:latest
      - name: 压缩
        run: tar -zcvf ibox_x86.tar.gz ibox.tar
      - name: 上传临时包
        uses: actions/upload-artifact@v4
        with:
          path: ibox_x86.tar.gz
          name: ibox-x86
      - name: 发布Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ibox-${{ github.run_number }}
          files: ibox_x86.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
